<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="ZeroDelay">
  <defs>
    <linearGradient id="zd-grad-icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="zd-grad-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="zd-grad-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 纯平近黑底（与站点 #0b0d12 同源） -->
  <rect width="1280" height="640" fill="#0b0d12"/>

  <!-- 水印圆环：「0 / 零」母题 -->
  <circle cx="1180" cy="80" r="260" fill="none" stroke="url(#zd-grad-icon)" stroke-width="48" opacity="0.05"/>
  <circle cx="60" cy="620" r="150" fill="none" stroke="#22d3ee" stroke-width="32" opacity="0.04"/>

  <!-- 角括号装饰 -->
  <g stroke="#22d3ee" stroke-width="4" fill="none" opacity="0.45">
    <path d="M 56 108 L 56 56 L 108 56"/>
    <path d="M 1172 56 L 1224 56 L 1224 108"/>
    <path d="M 1224 532 L 1224 584 L 1172 584"/>
    <path d="M 108 584 L 56 584 L 56 532"/>
  </g>

  <!-- 图标：圆环 + Z -->
  <g transform="translate(584,120) scale(1.75)">
    <rect width="64" height="64" rx="14" fill="#0f172a"/>
    <circle cx="32" cy="32" r="21" fill="none" stroke="url(#zd-grad-icon)" stroke-width="5.5"/>
    <polygon points="19,19 45,19 45,25 29,25 45,45 45,51 19,51 19,45 35,45 19,25" fill="url(#zd-grad-icon)"/>
  </g>

  <!-- 字标 -->
  <text x="640" y="368" text-anchor="middle"
        font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
        font-size="96" font-weight="800" letter-spacing="1.5">
    <tspan fill="#ffffff">Zero</tspan><tspan fill="url(#zd-grad-text)">Delay</tspan>
  </text>

  <!-- 副标语 -->
  <text x="640" y="432" text-anchor="middle"
        font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif"
        font-size="30" fill="#9ca3af" letter-spacing="4">开服不绕路，下载零等待</text>

  <!-- 分隔细线 -->
  <rect x="500" y="480" width="280" height="2" fill="url(#zd-grad-line)"/>

  <!-- 方括号标签 -->
  <text x="640" y="536" text-anchor="middle"
        font-family="'Cascadia Code', Consolas, 'JetBrains Mono', monospace"
        font-size="26" fill="#22d3ee" letter-spacing="1">[ FIVEM / REDM 资源与中文教程社区 ]</text>
</svg>
